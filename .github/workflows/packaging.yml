# Validate QuickBar builds the same way distro packages do (Arch PKGBUILD / Fedora spec).
# On version tags, also verify the release tarball URL used by the AUR PKGBUILD.

name: Packaging

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/packaging.yml'
      - 'CMakeLists.txt'
      - 'metadata.json'
      - 'packaging/**'
      - 'qml/**'
      - 'src/**'
      - 'third_party/**'
      - 'main.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    name: Build (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel pacman-contrib cmake extra-cmake-modules gcc \
            libplasma plasma-workspace \
            qt6-base qt6-declarative \
            kconfig kcoreaddons ki18n kitemmodels kwindowsystem kirigami

      - name: CMake build (same as PKGBUILD)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=None \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          test -f build/plasma/applets/org.quickbar.globalmenu.so

      - name: Verify versions match across packaging files
        run: |
          cmake_ver=$(sed -n 's/^project(quickbar VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          meta_ver=$(sed -n 's/.*"Version": "\([^"]*\)".*/\1/p' metadata.json)
          pkgbuild_ver=$(sed -n 's/^pkgver=\(.*\)/\1/p' packaging/arch/PKGBUILD)
          deb_ver=$(sed -n '1s/^quickbar (\([0-9.]*\).*/\1/p' packaging/debian/changelog)
          rpm_ver=$(sed -n 's/^Version:[[:space:]]*\(.*\)/\1/p' packaging/rpm/quickbar.spec)
          dsc_ver=$(sed -n 's/^Version:[[:space:]]*\([0-9.]*\).*/\1/p' packaging/obs/quickbar.dsc)
          echo "CMake: ${cmake_ver}"
          echo "metadata: ${meta_ver}"
          echo "PKGBUILD: ${pkgbuild_ver}"
          echo "debian changelog: ${deb_ver}"
          echo "rpm spec: ${rpm_ver}"
          echo "obs dsc: ${dsc_ver}"
          for ver in "${meta_ver}" "${pkgbuild_ver}" "${deb_ver}" "${rpm_ver}" "${dsc_ver}"; do
            test "${cmake_ver}" = "${ver}"
          done

      - name: Validate PKGBUILD with makepkg (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          work=/tmp/makepkg-test
          mkdir -p "$work"
          cp packaging/arch/PKGBUILD "$work/"
          useradd -m -d /home/builder builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$work"
          cd "$work"
          sed -i "s/^pkgver=.*/pkgver=${ver}/" PKGBUILD
          su builder -c "updpkgsums && makepkg -f --noconfirm"
          find pkg -name org.quickbar.globalmenu.so | grep -q .

  fedora:
    name: Build (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake extra-cmake-modules gcc-c++ rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            libplasma-devel plasma-workspace-devel \
            kf6-kconfig-devel kf6-kcoreaddons-devel kf6-ki18n-devel \
            kf6-kitemmodels-devel kf6-kwindowsystem-devel kf6-kirigami-devel \
            libX11-devel libXtst-devel

      - name: CMake build (same as RPM spec)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          test -f build/plasma/applets/org.quickbar.globalmenu.so

      - name: rpmbuild (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/SOURCES
          tar -czf ~/rpmbuild/SOURCES/quickbar-${ver}.tar.gz \
            --transform "s,^,quickbar-${ver}/," \
            --exclude=build --exclude=.git .
          rpmbuild -ba packaging/rpm/quickbar.spec \
            --define "version ${ver}"

  release-tarball:
    name: Verify release tarball URL
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub archive exists
        run: |
          ver="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/v${ver}.tar.gz"
          echo "Checking ${url}"
          curl -fsSIL -o /dev/null -w '%{http_code}\n' "${url}" | grep -q '^200$'

  aur-publish:
    name: Publish to AUR
    needs: [arch, fedora, release-tarball]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install pacman dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel pacman-contrib git openssh curl

      - name: Configure SSH
        run: |
          mkdir -p -m 700 /root/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > /root/.ssh/aur_deploy
          chmod 600 /root/.ssh/aur_deploy
          ssh-keyscan -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts

      - name: Setup builder user
        run: |
          useradd -m -d /home/builder builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir -p -m 700 /home/builder/.ssh
          cp /root/.ssh/aur_deploy /home/builder/.ssh/
          cp /root/.ssh/known_hosts /home/builder/.ssh/
          chown -R builder:builder /home/builder/.ssh

      - name: Push to AUR
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          su builder -c "
            set -e
            git config --global user.name \"Kevin Budz\"
            git config --global user.email \"kevin.budz052@gmail.com\"
            export GIT_SSH_COMMAND=\"ssh -i /home/builder/.ssh/aur_deploy -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o KexAlgorithms=curve25519-sha256\"
            
            git clone ssh://aur@aur.archlinux.org/plasma6-applets-quickbar.git /home/builder/aur-repo
            cd /home/builder/aur-repo
            
            cp \"\$WORKSPACE/packaging/arch/PKGBUILD\" ./PKGBUILD
            sed -i \"s/^pkgver=.*/pkgver=\${ver}/\" PKGBUILD
            sed -i \"s/^pkgrel=.*/pkgrel=1/\" PKGBUILD
            
            updpkgsums
            makepkg --printsrcinfo > .SRCINFO
            
            git add PKGBUILD .SRCINFO
            if git diff --cached --quiet; then
              echo 'No changes to commit'
            else
              git commit -m \"Release: \${ver}\"
              git push origin master
            fi
          "
